#
# Sign the content documents of the five kinds (README, "The flow").
#
#   work   asks the plugins service for each kind's entries and withdrawn
#          rows (bin/fetch.mjs) and hands the answers on as an artifact.
#          Environment `content-service`: an OIDC token whose audience the
#          service pins, and NO secret. When the service door is not open
#          (HTTP 404, or `unavailable`) this job ends green with "service
#          door not open" and nothing else runs: every kind keeps its last
#          signed documents, and the next run asks again.
#   sign   one leg per kind, one after another. Each leg runs in that kind's
#          own environment, `publish-<kind>`, which holds that kind's one
#          key, and has NO OIDC token. A leg opens the `data` branch, signs
#          its kind (bin/sign.mjs; the only step that sees the key, and it
#          reaches no network), and moves `data` forward (bin/data.mjs).
#
# So the job that reads bytes the service chose holds no key, and a job that
# holds a key cannot speak to the service and holds no other kind's key. A
# leg's environment and secret are spelt out in the matrix below, one line
# each, and test/workflows.test.mjs holds that table to lib/kinds.mjs.
#
# The legs do not stop one another: a kind that cannot be signed fails its own
# leg and keeps its last signed pair, and the others go on.

name: Sign

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: content-sign
  cancel-in-progress: false

jobs:
  work:
    name: Read the five kinds from the plugins service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: content-service
    permissions:
      contents: read
      id-token: write
    outputs:
      todo: ${{ steps.fetch.outputs.todo }}
    env:
      CONTENT_SERVICE_URL: ${{ vars.CONTENT_SERVICE_URL }}
    steps:
      - name: Check out the signer (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Ask the service for each kind
        id: fetch
        run: node bin/fetch.mjs --out "$RUNNER_TEMP/exports"

      - name: Hand the answers to the signing legs
        if: steps.fetch.outputs.todo == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-exports
          path: ${{ runner.temp }}/exports
          if-no-files-found: error
          retention-days: 1

      - name: Fail when the service refused a call
        if: steps.fetch.outputs.failed == 'true'
        run: |
          echo "The service refused at least one kind's call; see the step above. The kinds that were answered are still signed."
          exit 1

  sign:
    name: Sign ${{ matrix.kind }}
    needs: work
    if: ${{ !cancelled() && needs.work.outputs.todo == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - kind: commands
            environment: publish-commands
            secret: ASTRA_COMMANDS_SIGNING_KEY
          - kind: characters
            environment: publish-characters
            secret: ASTRA_CHARACTERS_SIGNING_KEY
          - kind: models
            environment: publish-models
            secret: ASTRA_MODELS_SIGNING_KEY
          - kind: animsets
            environment: publish-animsets
            secret: ASTRA_ANIMSETS_SIGNING_KEY
          - kind: packs
            environment: publish-packs
            secret: ASTRA_PACKS_SIGNING_KEY
    environment: ${{ matrix.environment }}
    permissions:
      contents: write
    env:
      KIND: ${{ matrix.kind }}
    steps:
      - name: Check out the signer (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out the published trust.json (astra-registry; verified under the compiled roots)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mihailinl/astra-registry
          ref: main
          path: registry-trust
          sparse-checkout: registry/v1/trust.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Take the answers from the work job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: content-exports
          path: ${{ runner.temp }}/exports

      - name: Open the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/data.mjs open --dir "$RUNNER_TEMP/data"

      - name: Sign the kind
        env:
          CONTENT_SIGNING_KEY: ${{ secrets[matrix.secret] }}
        run: >-
          node bin/sign.mjs --kind "$KIND"
          --exports "$RUNNER_TEMP/exports"
          --data "$RUNNER_TEMP/data"
          --trust registry-trust/registry/v1/trust.json
          --report "$RUNNER_TEMP/report.json"

      - name: Move data forward, then fail if a withdrawn row had to be kept
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/data.mjs publish --dir "$RUNNER_TEMP/data" --report "$RUNNER_TEMP/report.json"
